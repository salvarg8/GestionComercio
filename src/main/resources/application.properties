spring.application.name=gestion-comercio

# SQLite
spring.datasource.url=jdbc:sqlite:data/gestion-comercio.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite admite un solo escritor a la vez. Con una única conexión todas las
# operaciones de la aplicación se ordenan en fila en lugar de fallar con
# "database is locked"; @Version cubre los datos leídos antes de modificarlos.
spring.datasource.hikari.maximum-pool-size=1
# Si otro proceso (por ejemplo un visor de la base) tiene la base bloqueada,
# esperar hasta 5 segundos antes de fallar.
spring.datasource.hikari.data-source-properties.busy_timeout=5000

# Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
spring.application.name=gestion-comercio

# PostgreSQL. Cada PC (caja, depósito) apunta al mismo servidor; los valores
# por defecto son los del docker-compose.yml de desarrollo y se pueden cambiar
# con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_comercio}
spring.datasource.username=${DB_USER:gestion}
spring.datasource.password=${DB_PASSWORD:gestion}

# Una aplicación de escritorio usa pocas conexiones a la vez. Con varias PC
# conectadas, cada instancia suma su pool al total (PostgreSQL admite 100 por
# defecto). Los conflictos entre transacciones los detecta @Version.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# El esquema lo crean y actualizan las migraciones de Flyway
# (src/main/resources/db/migration). Cada cambio de entidad viene con su
# script V<n>__descripcion.sql; Hibernate sólo valida que el esquema coincida
# con las entidades y no arranca si no es así.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Copias de seguridad (pg_dump / pg_restore).
# PG_BIN: carpeta de las herramientas de PostgreSQL; vacía para buscarlas en
# pgsql/bin (instalador) y en el PATH. Deben ser de la misma versión mayor que
# el servidor o más nuevas.
backup.herramientas=${PG_BIN:}
# Copias automáticas y copias previas a cada restauración.
backup.carpeta-automatica=${BACKUP_CARPETA:data/backups}
# Cantidad de copias automáticas que se conservan.
backup.retencion=${BACKUP_RETENCION:14}
# true sólo en la PC servidor: una copia por día y otra después de cada cierre de caja.
backup.automatico=${BACKUP_AUTOMATICO:false}

# Facturación electrónica (ARCA). El ambiente, el punto de venta y el
# certificado se configuran desde la aplicación y quedan en la base.
# ARCA_CLAVE_CERTIFICADO: clave con que se cifra el certificado guardado en la
# base. Tiene que ser la misma en todas las PC del comercio y no debe perderse
# (sin ella hay que generar un certificado nuevo).
arca.clave-certificado=${ARCA_CLAVE_CERTIFICADO:}
# Tiempo máximo de espera de cada llamada a ARCA.
arca.timeout=${ARCA_TIMEOUT:30s}
# Desde este total, la factura a consumidor final debe identificar al comprador.
arca.monto-identificacion-consumidor-final=${ARCA_MONTO_IDENTIFICACION:10000000}
# Log de pedidos y respuestas (sin token, sign ni certificado): DEBUG para verlos.
logging.level.org.gestionComercio.arca=INFO

spring.application.name=gestion-comercio

# PostgreSQL. Cada PC (caja, depósito) apunta al mismo servidor; los valores
# por defecto son los del docker-compose.yml de desarrollo y se pueden cambiar
# con las variables de entorno DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_comercio}
spring.datasource.username=${DB_USER:gestion}
spring.datasource.password=${DB_PASSWORD:gestion}

# Una aplicación de escritorio usa pocas conexiones a la vez. Con varias PC
# conectadas, cada instancia suma su pool al total (PostgreSQL admite 100 por
# defecto). Los conflictos entre transacciones los detecta @Version.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# El esquema lo crean y actualizan las migraciones de Flyway
# (src/main/resources/db/migration). Cada cambio de entidad viene con su
# script V<n>__descripcion.sql; Hibernate sólo valida que el esquema coincida
# con las entidades y no arranca si no es así.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
